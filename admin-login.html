<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Forefront Cleaning Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="auth.js" defer></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center px-4">
    <div class="max-w-xl w-full bg-white rounded-3xl shadow-xl p-8">
        <h1 class="text-3xl font-bold mb-4">Admin Login</h1>
        <p class="text-slate-600 mb-6">Use your administrator credentials to access the dashboard.</p>

        <div id="login-error" class="hidden mb-4 text-sm text-red-700 bg-red-100 border border-red-200 rounded-lg p-3"></div>
        <form id="admin-login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2" for="email">Email address</label>
                <input id="email" name="email" type="email" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" for="password">Password</label>
                <input id="password" name="password" type="password" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <button type="submit" class="w-full bg-green-700 text-white py-3 rounded-2xl font-semibold hover:bg-green-800 transition">Sign in as Admin</button>
        </form>

        <div class="mt-6 text-sm text-slate-600">
            <p class="mb-2">Return to <a href="login.html" class="text-green-700 font-semibold">user login</a>.</p>
            <p>Demo admin credentials: <strong>admin@cleaning.com / Admin123!</strong></p>
        </div>
    </div>
</body>

</html>
