<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Forefront Cleaning Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="auth.js" defer></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center px-4">
    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8">
        <h1 class="text-3xl font-bold mb-4">Create an Account</h1>
        <p class="text-slate-600 mb-6">Register to manage service requests, invoices, and your customer dashboard.</p>

        <div id="register-error" class="hidden mb-4 text-sm text-red-700 bg-red-100 border border-red-200 rounded-lg p-3"></div>
        <form id="register-form" class="grid gap-4">
            <div>
                <label class="block text-sm font-medium mb-2" for="first_name">First name</label>
                <input id="first_name" name="first_name" type="text" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" for="last_name">Last name</label>
                <input id="last_name" name="last_name" type="text" class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" for="company_name">Company name</label>
                <input id="company_name" name="company_name" type="text" class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" for="phone">Phone number</label>
                <input id="phone" name="phone" type="tel" class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" for="email">Email address</label>
                <input id="email" name="email" type="email" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2" for="password">Password</label>
                <input id="password" name="password" type="password" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <button type="submit" class="w-full bg-green-700 text-white py-3 rounded-2xl font-semibold hover:bg-green-800 transition">Create account</button>
        </form>

        <div class="mt-6 text-sm text-slate-600">
            Already have an account? <a href="login.html" class="text-green-700 font-semibold">Sign in</a>.
        </div>
    </div>
</body>

</html>
